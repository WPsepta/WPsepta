<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP septa | Simple Green Neon</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        
        body {
            background: #000000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* MUSIC TOGGLE SWITCH (DI ATAS) */
        .music-box {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .music-box span { font-size: 9px; color: #00ff00; letter-spacing: 1px; font-weight: bold; }

        .switch {
            position: relative; display: inline-block;
            width: 34px; height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }

        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }

        input:checked + .slider { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        input:checked + .slider:before { transform: translateX(14px); }

        /* CONTAINER UTAMA */
        .container {
            width: 90%; max-width: 360px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            border-radius: 25px;
            padding: 40px 20px; text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            position: relative;
        }

        .profile-img {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid #00ff00; margin-bottom: 15px;
            object-fit: cover; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        h1 { font-size: 20px; color: #00ff00; text-shadow: 0 0 8px rgba(0, 255, 0, 0.8); margin-bottom: 5px; }
        .sub-text { font-size: 11px; opacity: 0.6; margin-bottom: 30px; color: #fff; }

        .links-container { display: flex; flex-direction: column; gap: 12px; }

        .link-card {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 18px; border-radius: 15px;
            text-decoration: none; color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .link-card:hover {
            border-color: #00ff00;
            transform: translateY(-3px);
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .link-card i { font-size: 22px; width: 35px; }

        /* WARNA ICON */
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { background: -webkit-linear-gradient(#405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .fa-facebook { color: #1877F2; }
        .fa-tiktok { color: #fff; text-shadow: 2px 2px #ff0050, -2px -2px #00f2ff; }

        .link-text { flex-grow: 1; text-align: left; margin-left: 10px; font-size: 13px; font-weight: 600; }

        .footer { margin-top: 40px; font-size: 9px; opacity: 0.3; color: #00ff00; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="ssstik.io_1774188886627.mp3" type="audio/mpeg">
    </audio>

    <div class="music-box">
        <span id="musicLabel">OFF</span>
        <label class="switch">
            <input type="checkbox" id="musicToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="container">
        <img src="quality_restoration_20260224143600485.png" alt="WP septa" class="profile-img">
        <h1>WP septa</h1>
        <p class="sub-text">MY PERSONAL PROFILE</p>

        <div class="links-container">
            <a href="https://wa.me/6283169444566" class="link-card" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span class="link-text">WhatsApp Bisnis</span>
            </a>
            <a href="https://wa.me/628980332138" class="link-card" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span class="link-text">WhatsApp Pribadi</span>
            </a>
            <a href="https://www.tiktok.com/@wp_septa" class="link-card" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span class="link-text">TikTok</span>
            </a>
            <a href="https://instagram.com/wp_septaa" class="link-card" target="_blank">
                <i class="fab fa-instagram"></i>
                <span class="link-text">Instagram</span>
            </a>
            <a href="https://www.facebook.com/WP.septa.1397" class="link-card" target="_blank">
                <i class="fab fa-facebook"></i>
                <span class="link-text">Facebook</span>
            </a>
        </div>
        <div class="footer">BY WP SEPTA &bull; 2026</div>
    </div>

    <script>
        const audio = document.getElementById("bgMusic");
        const toggle = document.getElementById("musicToggle");
        const label = document.getElementById("musicLabel");

        toggle.addEventListener('change', function() {
            if(this.checked) {
                audio.play();
                label.innerText = "ON";
                label.style.color = "#00ff00";
            } else {
                audio.pause();
                label.innerText = "OFF";
                label.style.color = "#666";
            }
        });
    </script>

</body>
</html>
