<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; overflow: hidden; position: relative; }
        .music-box { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 50px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(0, 255, 0, 0.3); backdrop-filter: blur(5px); z-index: 10; }
        .music-box span { font-size: 9px; color: #00ff00; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        input:checked + .slider:before { transform: translateX(14px); }
        .container { width: 90%; max-width: 360px; background: rgba(0, 0, 0, 0.95); border: 2px solid #00ff00; border-radius: 25px; padding: 40px 20px; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3); }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00ff00; margin-bottom: 15px; object-fit: cover; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        h1 { font-size: 20px; color: #00ff00; text-shadow: 0 0 8px rgba(0, 255, 0, 0.8); margin-bottom: 5px; }
        .sub-text { font-size: 11px; opacity: 0.6; margin-bottom: 30px; }
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        .link-card { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 14px 18px; border-radius: 15px; text-decoration: none; color: white; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .link-card:hover { border-color: #00ff00; transform: translateY(-3px); }
        .donate-card { border: 1px solid #ffcc00 !important; background: rgba(255, 204, 0, 0.08) !important; }
        .donate-card:hover { border-color: #fff !important; box-shadow: 0 0 15px rgba(255, 204, 0, 0.6) !important; }
        .fa-whatsapp { color: #25D366; }
        .fa-instagram { color: #E4405F; }
        .fa-facebook { color: #1877F2; }
        .fa-tiktok { color: #fff; text-shadow: 1px 1px #ff0050, -1px -1px #00f2ff; }
        .fa-coffee { color: #ffcc00; }
        .link-text { flex-grow: 1; text-align: left; margin-left: 10px; font-size: 13px; font-weight: 600; }
        .footer { margin-top: 30px; font-size: 8px; opacity: 0.3; color: #00ff00; }
    </style>
</head>
<body>
    <audio id="bgMusic" loop><source src="ssstik.io_1774188886627.mp3" type="audio/mpeg"></audio>
    
    <div class="music-box"> <span id="musicLabel">OFF</span> <label class="switch"> <input type="checkbox" id="musicToggle"> <span class="slider"></span> </label> </div>
    
    <div class="container">
        <img src="quality_restoration_20260224143600485.png" class="profile-img">
        <h1>WP septa</h1>
        <p class="sub-text">NEON GREEN // SYSTEM ACTIVE</p>
        
        <div class="links-container">
            <a href="https://saweria.co/WPsepta" class="link-card donate-card" target="_blank">
                <i class="fas fa-coffee"></i>
                <span class="link-text">Support (Donasi)</span>
            </a>
            
            <a href="https://wa.me/6283169444566" class="link-card" target="_blank"><i class="fab fa-whatsapp"></i><span class="link-text">WhatsApp Bisnis</span></a>
            <a href="https://wa.me/628980332138" class="link-card" target="_blank"><i class="fab fa-whatsapp"></i><span class="link-text">WhatsApp Pribadi</span></a>
            <a href="https://www.tiktok.com/@wp_septa" class="link-card" target="_blank"><i class="fab fa-tiktok"></i><span class="link-text">TikTok</span></a>

    <script>
        const audio = document.getElementById("bgMusic");
        const toggle = document.getElementById("musicToggle");
        const label = document.getElementById("musicLabel");
        toggle.addEventListener('change', function() {
            if(this.checked) { audio.play(); label.innerText = "ON"; label.style.color = "#00ff00"; }
            else { audio.pause(); label.innerText = "OFF"; label.style.color = "#666"; }
        });
    </script>
</body>
